services:
  # India backend (own API + indiaDB)
  - type: web
    name: india-backend-api
    runtime: node
    plan: free
    region: oregon
    autoDeployTrigger: commit
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_LOCAL
        value: "false"
      - key: MONGO_URI
        value: mongodb+srv://ashishsingh0828_db_user:moGWkSR3SLs1gRY8@cluster0.lveqgsk.mongodb.net/indiaDB?retryWrites=true&w=majority&appName=Cluster0
      - key: JWT_SECRET
        value: f7e3c9a184b260d8e4f1a59c7b3d2e619483017a4b8c9e2f50d1a7b3c6e9f2a4
      - key: SITES
        value: india
      - key: ADMIN_EMAIL
        value: ie
      - key: ADMIN_PASSWORD
        value: iemarbles@123
      - key: CORS_ORIGINS
        value: "*"
      - key: EMAIL_USER
        value: iemarbletraders@gmail.com
      - key: EMAIL_PASS
        value: abcdefghijklmnop
      - key: NOTIFICATION_EMAIL
        value: iemarbletraders@gmail.com

  # India public website
  - type: web
    name: marbles-india-site
    runtime: static
    autoDeployTrigger: commit
    rootDir: .
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: india-backend-api
          property: host

  # India admin panel (locked to india site + india backend)
  - type: web
    name: india-admin-panel
    runtime: static
    autoDeployTrigger: commit
    rootDir: admin
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_USE_MOCK
        value: "false"
      - key: VITE_SITE
        value: india
      - key: VITE_API_URL
        fromService:
          type: web
          name: india-backend-api
          property: host
      - key: VITE_INDIA_URL
        fromService:
          type: web
          name: marbles-india-site
          property: host
