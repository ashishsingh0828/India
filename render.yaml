services:
  # India backend (own API + indiaDB)
  - type: web
    name: india-backend-api
    runtime: node
    plan: free
    region: oregon
    autoDeployTrigger: commit
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_LOCAL
        value: "false"
      - key: SEED_FORCE
        value: "false"
      # Keep SEED_FORCE false so admin edits and contact messages are not wiped on restart.
      - key: MONGO_URI
        value: mongodb+srv://ashishsingh0828_db_user:aj88XpPJzbIddp3m@cluster0.i8fmp7m.mongodb.net/indiaDB?retryWrites=true&w=majority&appName=Cluster0
      - key: JWT_SECRET
        value: f7e3c9a184b260d8e4f1a59c7b3d2e619483017a4b8c9e2f50d1a7b3c6e9f2a4
      - key: SITES
        value: india
      - key: ADMIN_EMAIL
        value: ie
      - key: ADMIN_PASSWORD
        value: iemarbles@123
      - key: CORS_ORIGINS
        value: "*"
      - key: EMAIL_USER
        value: iemarbletraders@gmail.com
      - key: EMAIL_PASS
        value: lqjjlvgywogbtbxc
      - key: MAIL_FROM
        value: IE Marbles <iemarbletraders@gmail.com>
      - key: NOTIFICATION_EMAIL
        value: iemarbletraders@gmail.com
      # Optional HTTPS mail path (recommended on Render free — SMTP ports 25/465/587 are blocked).
      # Deploy scripts/gmail-apps-script/Code.gs as a Web App, then set the URL here:
      # - key: GMAIL_SCRIPT_URL
      #   value: https://script.google.com/macros/s/XXXX/exec

  # India public website
  - type: web
    name: marbles-india-site
    runtime: static
    autoDeployTrigger: commit
    rootDir: .
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Full HTTPS URL — Render "host" alone can omit .onrender.com and break login
      - key: VITE_API_URL
        value: https://india-backend-api.onrender.com

  # India admin panel (locked to india site + india backend)
  - type: web
    name: india-admin-panel
    runtime: static
    autoDeployTrigger: commit
    rootDir: admin
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_USE_MOCK
        value: "false"
      - key: VITE_SITE
        value: india
      - key: VITE_API_URL
        value: https://india-backend-api.onrender.com
      - key: VITE_INDIA_URL
        value: https://marbles-india-site.onrender.com
